<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - bro said he knows a spot</title>
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
  <link rel="stylesheet" href="auth.css">
  <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
  <script src="smooth-scroll.js"></script>
</head>
<body>
  <div class="auth-container">
    <a href="index.html" class="back-link">&larr; Back to Home</a>
    <div class="form-wrapper">
      <!-- Sign In Form -->
      <form id="signInForm" class="auth-form active">
        <h2>Sign In</h2>
        <div class="input-group">
          <label for="signin-username">Username</label>
          <input type="text" id="signin-username" required>
        </div>
        <div class="input-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" required>
        </div>
        <button type="submit" class="auth-btn">Sign In</button>
        <p class="toggle-text">Don't have an account? <span class="toggle-link" id="showSignUp">Sign Up</span></p>
      </form>

      <!-- Sign Up Form -->
      <form id="signUpForm" class="auth-form">
        <h2>Sign Up</h2>
        <div class="input-group">
          <label for="signup-name">Name</label>
          <input type="text" id="signup-name" required>
        </div>
        <div class="input-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" required>
        </div>
        <div class="input-group">
          <label for="signup-email">Gmail</label>
          <input type="email" id="signup-email" required>
        </div>
        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required>
        </div>
        <div class="input-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" required>
        </div>
        <button type="submit" class="auth-btn">Sign Up</button>
        <p class="toggle-text">Already have an account? <span class="toggle-link" id="showSignIn">Sign In</span></p>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
